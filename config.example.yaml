# 예매 모니터 설정
max_requests_per_minute: 4

notifications:
  discord_webhook_url: ""
  heartbeat_webhook_url: ""   # 비우면 위 웹훅으로 폴백

  # 텔레그램 푸시 (Discord보다 폰 도달이 빠릅니다)
  # python3 telegram_setup.py <봇토큰> 을 돌리면 chat_id를 찾아줍니다.
  telegram:
    bot_token: ""
    chat_id: ""

targets:
  # 1) 예매 오픈 감시 (mode 생략 시 기본값)
  - name: "용산 IMAX 헤일메리 4/20"
    type: cgv
    site_no: "0013"
    date: "20260420"
    screen_filter: "IMAX"
    movie_filter: "헤일메리"

  # 2) 취소표 감시 — 날짜 전체 + 요일별 시간대 + 좌석 위치 (CGV 전용)
  - name: "용산 IMAX 오디세이 취소표"
    type: cgv
    site_no: "0013"
    dates: all                      # 예매 열린 상영일 전체 (날짜 목록도 가능)
    screen_filter: "IMAX"
    movie_filter: "오디세이"
    mode: cancel
    time_rules:                     # 평일/주말을 나눠 지정 (공휴일은 주말 취급)
      weekday: ["19:00", "23:59"]
      weekend: ["12:00", "20:00"]
    repeat_alert_sec: 60            # 자리가 열려 있는 동안 60초마다 다시 알림
                                    # (생략하면 새로 풀린 자리일 때만 1회)
    auto_book: true                 # 크롬을 몰아 좌석 선택까지 진행
    auto_pay: true                  # 카카오페이 QR까지 띄움 (승인은 폰으로 직접)
    expect_amount: 42000            # 최종결제금액이 이 값과 다르면 결제 중단
                                    # (콤보가 끼워지는 등 금액이 바뀌면 멈춤)
    tickets: 2                      # 예매 인원. 생략하면 min_consecutive 사용
                                    # 2명 이상이면 첫 좌석만 눌러 연석으로 잡습니다
    seats:                          # 좌석 조건 (생략하면 빈자리 수만 감시)
      rows: ["K", "L", "M", "N"]    # 감시할 열
      seat_no: [16, 29]             # 좌석 번호 범위
      min_consecutive: 2            # 나란히 붙어있어야 하는 최소 좌석 수

  # 3) 취소표 감시 — 메가박스는 잔여 좌석 "수"로만 감시
  - name: "코엑스 DOLBY 헤일메리 5/1 취소표"
    type: megabox
    branch_no: "1351"
    date: "20260501"
    screen_filter: "DOLBY"
    movie_filter: "헤일메리"
    mode: cancel

# 카톡결제 요청에 쓸 정보 (auto_pay: true 인 경우) — 전역 기본값
# 타겟마다 다른 사람에게 보내려면 해당 타겟 안에 kakaopay를 넣으면 덮어씁니다.
#   - name: "..."
#     kakaopay:
#       phone: "..."
#       birth: "..."
# 생년월일은 그 번호의 카카오페이 본인 확인용입니다. 다른 사람에게 보내면
# 그 사람이 결제하게 되고, 티켓은 이 CGV 계정에 남습니다.
# 채워두면 QR 대신 카카오톡으로 결제요청이 와서, 컴퓨터 앞에 없어도 승인 가능합니다.
# 비워두면 QR결제 탭을 띄웁니다.
# 개인정보입니다. config.yaml은 .gitignore에 있어야 합니다.
# 환경변수 CGV_KAKAO_PHONE / CGV_KAKAO_BIRTH 로도 지정할 수 있습니다.
kakaopay:
  phone: ""      # 01012345678
  birth: ""      # YYMMDD 6자리
